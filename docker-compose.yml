# The same container ./start.sh launches, for people who prefer Docker Compose.
# ./start.sh does not use this file; use one or the other, not both at once
# (they share the container name, so a second start fails rather than
# doubling up on the cards).
#
# Before the first start, from the root of this repository:
#   ./install.sh && ./download.sh     # the image and the two checkpoints
#   mkdir -p cache                    # kernel compile caches, owned by you
# Then:
#   HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose up -d
#   docker compose logs -f            # wait for "Application startup complete"
#   docker compose down               # stop (allows 120 s for a clean shutdown)
#
# LAYOUT (tp4 or pp4), IMAGE and MODELS_DIR are read from the shell or from
# .env; every other setting goes in docker/container.env (see
# docs/how-to-use.md). The API is published on 127.0.0.1:8000 only and has
# no API key.

services:
  glm53-flash:
    image: ${IMAGE:-ghcr.io/morrowmake/vllm-cmp170hx@sha256:cc26c8abb63953a37c6c1861cadc9188e99c1cceab403600b5822740f3a82ae0}
    container_name: glm53-flash
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /cache
    entrypoint: ["/bin/bash", "/recipe/serve.sh"]
    command: ["dflash"]
    shm_size: 16g
    stop_grace_period: 120s
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - docker/container.env
    environment:
      LAYOUT: ${LAYOUT:-tp4}
    volumes:
      - ./serve.sh:/recipe/serve.sh:ro
      - ./boot_check.py:/recipe/boot_check.py:ro
      - ./p2p_check.py:/recipe/p2p_check.py:ro
      - ./p2p_check.sh:/recipe/p2p_check.sh:ro
      - ./p2p_probe.cu:/recipe/p2p_probe.cu:ro
      - ${MODELS_DIR:-./models}/GLM-5.3-Flash-W4A16-MTP:/models/GLM-5.3-Flash-W4A16-MTP:ro
      - ${MODELS_DIR:-./models}/GLM-5.3-Flash-DFlash2:/models/GLM-5.3-Flash-DFlash2:ro
      - ./cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
