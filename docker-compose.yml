# The same container ./start.sh launches, as one command from a fresh clone:
#
#   docker compose up              # download the checkpoints, then serve
#   docker compose up -d           # the same in the background
#   docker compose ps              # the server shows (healthy) once /health answers
#   docker compose logs -f         # follow it
#   docker compose down            # stop (allows 120 s for a clean shutdown)
#
# `prepare` runs first and must finish: it makes ./cache and the model
# directory writable by the serving user and downloads the two checkpoints
# (~180 GiB; resumed if interrupted, skipped once complete). The serving user
# is whoever owns this checkout, so no user settings are needed; HOST_UID and
# HOST_GID override it. The server then starts as that user, never as root,
# with the release image, serve.sh and docker/container.env that ./start.sh
# uses. The one-time host setup (driver, Docker, NVIDIA Container Toolkit) is
# in the README.
#
# ./start.sh does not use this file; use one or the other, not both at once
# (they share the container name, so a second start fails rather than
# doubling up on the cards). LAYOUT (tp4 or pp4), MODELS_DIR and HF_TOKEN
# are read from the shell or from .env; every other setting goes in
# docker/container.env (see docs/how-to-use.md). The API is published on
# 127.0.0.1:8000 only and has no API key.

x-image: &image ${IMAGE:-ghcr.io/morrowmake/vllm-cmp170hx@sha256:18a2f26207568128e1d792ce923e86a74e40def1e43e492db83132cab8cdbe14}

services:
  prepare:
    image: *image
    user: "0:0"
    entrypoint: ["/bin/bash", "/recipe/prepare.sh"]
    command: ["prepare"]
    environment:
      HOST_UID: ${HOST_UID:-}
      HOST_GID: ${HOST_GID:-}
      HF_TOKEN:
      HF_HOME: /tmp/hf
    volumes:
      - ./docker/prepare.sh:/recipe/prepare.sh:ro
      - .:/checkout:ro
      - ${MODELS_DIR:-./models}:/models
      - ./cache:/cache

  glm53-flash:
    image: *image
    container_name: glm53-flash
    depends_on:
      prepare:
        condition: service_completed_successfully
    # Starts as root only to switch to the owner of /cache (the serving user
    # prepare chose) before serve.sh runs.
    user: "0:0"
    working_dir: /cache
    entrypoint: ["/bin/bash", "/recipe/prepare.sh", "serve"]
    command: ["dflash"]
    shm_size: 16g
    stop_grace_period: 120s
    # Back after a crash (a non-zero exit), up to 3 times; never after
    # docker compose stop/down.
    restart: on-failure:3
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - docker/container.env
    environment:
      LAYOUT: ${LAYOUT:-tp4}
      RECIPE_CACHE_ROOT: /cache
      TMPDIR: /cache/tmp
    volumes:
      - ./docker/prepare.sh:/recipe/prepare.sh:ro
      - ./serve.sh:/recipe/serve.sh:ro
      - ./boot_check.py:/recipe/boot_check.py:ro
      - ./p2p_check.py:/recipe/p2p_check.py:ro
      - ./p2p_check.sh:/recipe/p2p_check.sh:ro
      - ./p2p_probe.cu:/recipe/p2p_probe.cu:ro
      - ./patches/vllm/v1/executor/multiproc_executor.py:/opt/vllm-src/vllm/v1/executor/multiproc_executor.py:ro
      - ./patches/vllm/v1/worker/startup_plan.py:/opt/vllm-src/vllm/v1/worker/startup_plan.py:ro
      - ${MODELS_DIR:-./models}/GLM-5.3-Flash-W4A16-MTP:/models/GLM-5.3-Flash-W4A16-MTP:ro
      - ${MODELS_DIR:-./models}/GLM-5.3-Flash-DFlash2:/models/GLM-5.3-Flash-DFlash2:ro
      - ./cache:/cache
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 1800s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
